<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>سين جيم - DARK DEV</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

/* =========================
   🌌 GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

:root{
    --blue:#38bdf8;
    --purple:#8b5cf6;
    --green:#22c55e;
    --red:#ef4444;
    --gold:#facc15;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:white;
    background:#020617;
    position:relative;
}

/* 🌌 الخلفية */

body::before{
    content:"";
    position:fixed;
    inset:-30%;

    background:
    radial-gradient(circle at 20% 20%, rgba(56,189,248,.22), transparent 30%),
    radial-gradient(circle at 80% 30%, rgba(139,92,246,.22), transparent 35%),
    radial-gradient(circle at 50% 80%, rgba(34,197,94,.15), transparent 40%);

    filter:blur(80px);

    animation:moveBg 15s linear infinite alternate;

    z-index:0;
}

@keyframes moveBg{

    0%{
        transform:translate(-4%,-4%) scale(1);
    }

    100%{
        transform:translate(4%,4%) scale(1.1);
    }

}

/* ✨ النجوم */

.stars{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.5;
    animation:blink 3s infinite;
}

@keyframes blink{

    0%,100%{
        opacity:.2
    }

    50%{
        opacity:1
    }

}

/* =========================
   📦 SCREEN
========================= */

.screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:25px;
    position:relative;
    z-index:2;
}

.hidden{
    display:none !important;
}

/* =========================
   🧊 CARD
========================= */

.card{
    width:560px;
    max-width:95%;

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(22px);

    border-radius:35px;

    padding:40px;

    text-align:center;

    box-shadow:
    0 0 50px rgba(0,0,0,.5),
    inset 0 0 30px rgba(255,255,255,.03);

    animation:pop .5s ease;

    position:relative;

    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    inset:0;

    background:linear-gradient(
    130deg,
    transparent,
    rgba(255,255,255,.08),
    transparent
    );

    transform:translateX(-100%);

    animation:shine 5s linear infinite;
}

.card::after{
    content:"";
    position:absolute;
    width:200px;
    height:200px;
    background:rgba(56,189,248,.08);
    border-radius:50%;
    top:-70px;
    left:-70px;
    filter:blur(40px);
}

@keyframes shine{

    to{
        transform:translateX(100%);
    }

}

@keyframes pop{

    from{
        transform:scale(.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

.title{
    font-size:78px;
    font-weight:900;
    margin-bottom:10px;

    background:linear-gradient(45deg,#38bdf8,#8b5cf6,#22c55e);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:0 0 30px rgba(56,189,248,.4);
}

.subtitle{
    opacity:.7;
    margin-bottom:30px;
    font-size:18px;
}

/* =========================
   🔘 BUTTONS
========================= */

.btn{
    border:none;
    outline:none;
    cursor:pointer;

    padding:15px 28px;

    border-radius:18px;

    color:white;

    font-weight:700;
    font-size:16px;

    transition:.25s;

    margin:5px;

    position:relative;

    overflow:hidden;
}

.btn::before{
    content:"";
    position:absolute;
    inset:0;

    background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.2),
    transparent
    );

    transform:translateX(-100%);
}

.btn:hover::before{
    animation:btnShine .8s;
}

@keyframes btnShine{

    to{
        transform:translateX(100%);
    }

}

.btn:hover{
    transform:translateY(-3px) scale(1.03);
}

.blue{
    background:linear-gradient(45deg,#3b82f6,#06b6d4);
    box-shadow:0 0 20px rgba(59,130,246,.4);
}

.green{
    background:linear-gradient(45deg,#22c55e,#16a34a);
    box-shadow:0 0 20px rgba(34,197,94,.4);
}

.red{
    background:linear-gradient(45deg,#ef4444,#dc2626);
    box-shadow:0 0 20px rgba(239,68,68,.4);
}

.purple{
    background:linear-gradient(45deg,#8b5cf6,#6366f1);
    box-shadow:0 0 20px rgba(139,92,246,.4);
}

/* =========================
   ✏ INPUTS
========================= */

input{
    width:100%;

    margin:10px 0;

    padding:16px;

    border-radius:16px;

    border:none;
    outline:none;

    background:rgba(255,255,255,.08);

    color:white;

    font-size:16px;

    transition:.2s;
}

input:focus{
    box-shadow:0 0 20px rgba(56,189,248,.4);
    transform:scale(1.02);
}

/* =========================
   📂 CATEGORY
========================= */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    width:95%;
}

.box{
    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    border-radius:25px;

    padding:20px;

    backdrop-filter:blur(20px);

    box-shadow:0 0 20px rgba(255,255,255,.03);
}

.category{
    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.06);

    padding:14px;

    border-radius:14px;

    margin:8px 0;

    cursor:pointer;

    transition:.2s;
}

.category:hover{
    transform:scale(1.03);
    background:rgba(255,255,255,.1);
}

.selected{
    background:linear-gradient(45deg,#3b82f6,#8b5cf6)!important;
    box-shadow:0 0 20px rgba(59,130,246,.4);
}

/* =========================
   🎮 GAME
========================= */

.topbar{
    width:100%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}

.teamScore{
    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    padding:18px 30px;

    border-radius:22px;

    text-align:center;

    min-width:190px;

    backdrop-filter:blur(20px);

    box-shadow:
    0 0 25px rgba(255,255,255,.03),
    inset 0 0 20px rgba(255,255,255,.03);
}

.teamScore h3{
    opacity:.8;
}

.teamScore h1{
    font-size:48px;
    margin-top:5px;
}

.board{
    width:100%;

    display:grid;

    grid-template-columns:260px 1fr 260px;

    gap:20px;
}

.side,
.center{
    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    border-radius:28px;

    backdrop-filter:blur(20px);

    padding:20px;

    position:relative;

    overflow:hidden;
}

.side::before,
.center::before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    background:rgba(56,189,248,.05);
    border-radius:50%;
    top:-100px;
    left:-100px;
    filter:blur(40px);
}

.price{
    background:rgba(255,255,255,.07);

    padding:15px;

    border-radius:16px;

    margin:12px 0;

    cursor:pointer;

    transition:.25s;

    border:1px solid rgba(255,255,255,.05);

    position:relative;

    overflow:hidden;
}

.price::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.12),
    transparent
    );
    transform:translateX(-100%);
}

.price:hover::before{
    animation:btnShine .7s;
}

.price:hover{
    transform:scale(1.03);
    box-shadow:0 0 25px rgba(56,189,248,.25);
}

.used{
    opacity:.2;
    pointer-events:none;
    filter:grayscale(1);
}

.question{
    margin:30px 0;

    font-size:32px;

    min-height:120px;

    display:flex;

    justify-content:center;

    align-items:center;

    line-height:1.8;

    text-align:center;

    padding:15px;
}

/* =========================
   ⏳ TIMER
========================= */

.timerBox{
    position:relative;

    width:210px;
    height:210px;

    margin:25px auto;

    border-radius:40px;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(25px);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    box-shadow:
    0 0 35px rgba(56,189,248,.15),
    inset 0 0 20px rgba(255,255,255,.05);

    animation:floatTimer 4s ease-in-out infinite;
}

.timerGlow{
    position:absolute;

    width:260px;
    height:260px;

    background:radial-gradient(circle,
    rgba(56,189,248,.25),
    transparent 70%);

    animation:rotateGlow 8s linear infinite;
}

.timer{
    position:relative;
    z-index:2;

    font-size:84px;

    font-weight:900;

    line-height:1;

    color:#38bdf8;

    text-shadow:
    0 0 20px #38bdf8,
    0 0 45px rgba(56,189,248,.5);
}

.timerText{
    position:relative;
    z-index:2;

    margin-top:10px;

    font-size:18px;

    opacity:.7;

    letter-spacing:2px;
}

@keyframes rotateGlow{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes floatTimer{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-6px);
    }

}

/* 🔥 الدور */

.turn{
    margin-bottom:15px;

    font-size:20px;

    color:#facc15;

    text-shadow:0 0 10px rgba(250,204,21,.5);
}

/* =========================
   🎮 TEAM BUTTONS
========================= */

.answerButtons{
    width:100%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:25px;

    gap:15px;
}

.teamBtn{
    flex:1;

    padding:18px;

    font-size:18px;

    border-radius:20px;

    backdrop-filter:blur(15px);
}

.teamBtn:active{
    transform:scale(.95);
}

/* =========================
   🏆 WINNER
========================= */

.winner{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.7);

    backdrop-filter:blur(12px);

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    z-index:999;
}

.winnerCard{
    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.1);

    padding:50px;

    border-radius:35px;

    text-align:center;

    backdrop-filter:blur(30px);

    animation:pop .5s ease;
}

.winner h1{
    font-size:80px;

    margin-bottom:20px;

    color:#facc15;

    text-shadow:0 0 30px #facc15;
}

/* =========================
   📱 RESPONSIVE
========================= */

@media(max-width:1000px){

    .board{
        grid-template-columns:1fr;
    }

    .topbar{
        flex-direction:column;
        gap:15px;
    }

    .grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:700px){

    .answerButtons{
        flex-direction:column;
    }

    .teamBtn{
        width:100%;
    }

    .title{
        font-size:55px;
    }

    .question{
        font-size:24px;
    }

    .timerBox{
        width:180px;
        height:180px;
    }

    .timer{
        font-size:70px;
    }

}

</style>
</head>

]
}
};


/* =========================
   ⚙ STATE
========================= */

let state={

t1:"",
t2:"",

s1:0,
s2:0,

sel1:[],
sel2:[],

current:null,

time:20,

timer:null,

used:new Set()

};

/* =========================
   🚀 NAVIGATION
========================= */

function goTeams(){

    home.classList.add("hidden");

    teams.classList.remove("hidden");

}

function goCategories(){

    state.t1=t1.value.trim();

    state.t2=t2.value.trim();

    if(!state.t1 || !state.t2){

        alert("اكتب أسماء الفرق");

        return;
    }

    name1.innerText=state.t1;

    name2.innerText=state.t2;

    n1.innerText=state.t1;

    n2.innerText=state.t2;

    teams.classList.add("hidden");

    categories.classList.remove("hidden");

    renderCats();

}

/* =========================
   📂 CATEGORIES
========================= */

function renderCats(){

    c1.innerHTML="";

    c2.innerHTML="";

    cats.forEach(c=>{

        let d1=document.createElement("div");

        d1.className="category";

        d1.innerText=c;

        d1.onclick=()=>{

            if(state.sel1.includes(c)){

                state.sel1=state.sel1.filter(x=>x!==c);

                d1.classList.remove("selected");

            }else if(state.sel1.length<9){

                state.sel1.push(c);

                d1.classList.add("selected");

            }

        };

        c1.appendChild(d1);

        let d2=d1.cloneNode(true);

        d2.onclick=()=>{

            if(state.sel2.includes(c)){

                state.sel2=state.sel2.filter(x=>x!==c);

                d2.classList.remove("selected");

            }else if(state.sel2.length<9){

                state.sel2.push(c);

                d2.classList.add("selected");

            }

        };

        c2.appendChild(d2);

    });

}

/* =========================
   🎮 START GAME
========================= */
function startGame(){

    const min = 4;

    if(state.sel1.length < min || state.sel2.length < min){
        alert(`لازم كل فريق يختار على الأقل ${min} فئات`);
        return;
    }

    if(state.sel1.length !== state.sel2.length){
        alert("لازم عدد الفئات يكون متساوي بين الفريقين");
        return;
    }

    categories.classList.add("hidden");
    game.classList.remove("hidden");

    buildBoard(left, state.sel1);
    buildBoard(right, state.sel2);
}
/* =========================
   💰 BUILD BOARD
========================= */

function buildBoard(el, arr){

    el.innerHTML = "";

    [200,400,600].forEach(price=>{

        arr.forEach(cat=>{

            let key = el.id + "-" + cat + "-" + price;

            let d = document.createElement("div");

            d.className = "price";

            d.innerHTML = `
                <h3>${cat}</h3>
                <p>${price} نقطة</p>
            `;

            d.onclick = () => {

                if(state.used.has(key)) return;

                state.used.add(key);

                d.classList.add("used");

                openQuestion(cat, price);

            };

            el.appendChild(d);

        });

    });
}

/* =========================
   ❓ OPEN QUESTION
========================= */

function openQuestion(catName, price){

    clearInterval(state.timer);

    state.current = {
        cat: catName,
        price: price
    };

    cat.innerText = `${catName} • ${price}`;

    let arr = qs[catName][price];
    q.innerText = arr[Math.floor(Math.random() * arr.length)];

    if(price == 200){
        turnText.innerText = "🟢 سؤال سهل";
    } else if(price == 400){
        turnText.innerText = "🟡 سؤال متوسط";
    } else {
        turnText.innerText = "🔴 سؤال صعب";
    }

    startTimer();
}

/* =========================
   ⏳ TIMER
========================= */

function startTimer(){

    clearInterval(state.timer);

    state.time=20;

    time.innerText=state.time;

    time.style.color="#38bdf8";

    time.style.textShadow="0 0 20px #38bdf8";

    state.timer=setInterval(()=>{

        state.time--;

        time.innerText=state.time;

        /* 🔥 آخر 5 ثواني */

        if(state.time<=5){

            time.style.color="#ef4444";

            time.style.textShadow="0 0 25px red";

            time.style.transform="scale(1.1)";

        }else{

            time.style.transform="scale(1)";

        }

        if(state.time<=0){

            clearInterval(state.timer);

            state.current=null;

            q.innerText="⏰ انتهى الوقت";

            turnText.innerText="❌ لم يتم احتساب نقاط";

        }

    },1000);

}

/* =========================
   ✔ ANSWER
========================= */

function answer(team){

    if(!state.current) return;

    clearInterval(state.timer);

    if(team===1){

        state.s1 += state.current.price;

        s1.innerText=state.s1;

        turnText.innerText=`🔥 ${state.t1} حصل على النقاط!`;

    }else{

        state.s2 += state.current.price;

        s2.innerText=state.s2;

        turnText.innerText=`🔥 ${state.t2} حصل على النقاط!`;

    }

    q.innerText="✔ تمت الإجابة";

    time.style.color="#22c55e";

    time.style.textShadow="0 0 25px #22c55e";

    state.current=null;

    checkWinner();

}

/* =========================
   🏆 WINNER
========================= */

function checkWinner(){

    if(state.used.size >= 24){

        setTimeout(()=>{

            let winnerText="";

            if(state.s1 > state.s2){

                winnerText=state.t1;

            }else if(state.s2 > state.s1){

                winnerText=state.t2;

            }else{

                winnerText="تعادل";

            }

            let win=document.createElement("div");

            win.className="winner";

            win.innerHTML=`

            <div class="winnerCard">

                <h1>
                    🏆 ${winnerText}
                </h1>

                <button class="btn purple" onclick="location.reload()">
                    لعب مرة أخرى
                </button>

            </div>

            `;

            document.body.appendChild(win);

        },800);

    }

}
